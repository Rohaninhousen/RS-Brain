<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>RS-Brain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky tab bar over four views (leaderboard, data & tech, moats); a right-side drawer for one player; a modal form to add or edit. */
:root{--bg:#f2f3f5;--panel:#fff;--sunk:#f7f8fa;--ink:#14181f;--mute:#5b6472;--line:#d9dde4;--accent:#1f4fd8;--accent-ink:#fff;--me:#fff3d1;--me-line:#d9a400;
--s-none:#f4d9d4;--s-none-ink:#8a2b1c;--s-mid:#f6e7b8;--s-mid-ink:#6b4f00;--s-strong:#bfe6cc;--s-strong-ink:#0d5a2b;
--v-dur:#0d5a2b;--v-shaky:#8a6100;--v-build:#a1321f;--shade:rgba(20,24,31,.45);
--display:'Schibsted Grotesk',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--panel:#171b22;--sunk:#12161c;--ink:#e8ebf0;--mute:#9aa3b2;--line:#2b323d;--accent:#7ea2ff;--accent-ink:#0e1116;--me:#3a3010;
--s-none:#4a2620;--s-none-ink:#ffb4a6;--s-mid:#4a3d12;--s-mid-ink:#f2d27a;--s-strong:#14442a;--s-strong-ink:#8be0ab;--v-dur:#8be0ab;--v-shaky:#f2d27a;--v-build:#ffb4a6;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--panel:#171b22;--sunk:#12161c;--ink:#e8ebf0;--mute:#9aa3b2;--line:#2b323d;--accent:#7ea2ff;--accent-ink:#0e1116;--me:#3a3010;
--s-none:#4a2620;--s-none-ink:#ffb4a6;--s-mid:#4a3d12;--s-mid-ink:#f2d27a;--s-strong:#14442a;--s-strong-ink:#8be0ab;--v-dur:#8be0ab;--v-shaky:#f2d27a;--v-build:#ffb4a6;--shade:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:30px;font-weight:800;margin:28px 0 4px;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:19px;margin:28px 0 8px;text-wrap:balance}
h3{text-wrap:balance}
.lede{color:var(--mute);margin:0 0 12px;max-width:72ch}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-family:var(--mono);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px}.live i{width:8px;height:8px;border-radius:50%;background:var(--v-dur);display:inline-block}
.live.off i{background:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn.danger{color:var(--v-build)}
.btn.sm{padding:4px 10px;font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;margin-top:14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs a{text-decoration:none;color:var(--mute);padding:6px 12px;border-radius:6px;font-weight:500;font-size:14px}
.tabs a[aria-current=page]{background:var(--ink);color:var(--bg)}
.tabs a:hover:not([aria-current]){color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.filters input,.filters select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;font-size:14px;min-width:0}
.filters input{width:190px}
.rules{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin:12px 0}
.rules b{color:var(--ink)}
.chip{display:inline-block;padding:1px 8px;border-radius:4px;font-family:var(--mono);font-size:12px;white-space:nowrap}
.c-none{background:var(--s-none);color:var(--s-none-ink)}.c-mid{background:var(--s-mid);color:var(--s-mid-ink)}.c-strong{background:var(--s-strong);color:var(--s-strong-ink)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink);background:var(--sunk);white-space:nowrap}
.cat{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500;background:var(--panel);text-align:left}
#lb{min-width:820px}#lb td,#lb th{text-align:center}#lb .l{text-align:left;padding-left:12px}
td.rk{color:var(--mute);font-family:var(--mono);font-size:12px;width:40px}
tr.me td{background:var(--me)}tr.me td.nm{box-shadow:inset 3px 0 0 var(--me-line)}
.nm button{all:unset;cursor:pointer;font-weight:700}.nm button:hover,.nm button:focus-visible{text-decoration:underline}
.nm small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:block;margin:0 auto;width:38px;padding:4px 0;border-radius:5px;font-family:var(--mono);font-weight:600;font-size:13px;text-align:center}
.cell.c-none{background:var(--s-none);color:var(--s-none-ink)}.cell.c-mid{background:var(--s-mid);color:var(--s-mid-ink)}.cell.c-strong{background:var(--s-strong);color:var(--s-strong-ink)}
.cell:hover,.cell:focus-visible{outline:2px solid var(--accent)}.cell[aria-expanded=true]{outline:2px solid var(--ink)}
.tot{font-weight:700;font-family:var(--mono)}
.v{font-size:12px;font-weight:700;white-space:nowrap}.v.d{color:var(--v-dur)}.v.s{color:var(--v-shaky)}.v.b{color:var(--v-build)}
#lb tr.det td{background:var(--sunk);text-align:left;padding:14px 16px}
dl.kv{margin:0;display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;max-width:88ch}
dl.kv dt{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}dl.kv dd{margin:0}
.lead{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lead div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.lead b{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
/* data & tech */
.mx{min-width:900px}.mx td.nm{width:200px}.mx td.cad{width:150px;white-space:normal}.mx th.r{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:10px 4px;height:190px;text-align:left;vertical-align:bottom}
.mx td.dot{text-align:center;width:34px;padding:6px 2px}.mx td.dot span{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--accent)}
.mx td.dot.n span{background:transparent;border:1px solid var(--line)}
.mx tbody tr:hover td{background:var(--sunk)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.tc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tc header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tc h3{margin:0;font-size:16px}.tc h3 button{all:unset;cursor:pointer}.tc h3 button:hover{text-decoration:underline}
.tc .tags{display:flex;flex-wrap:wrap;gap:4px}
.tc dl.kv{grid-template-columns:86px minmax(0,1fr);font-size:13.5px}
.tc.me{border-color:var(--me-line);background:var(--me)}
.cad{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap}
.note{background:var(--sunk);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--mute)}
/* demos */
.dgrid{display:grid;gap:14px}
.dp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.dp header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.dp h3{margin:0;font-size:17px}
.dp ul.u{margin:0 0 12px;padding-left:18px;columns:2 260px;column-gap:28px;font-size:14px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.m{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk);display:flex;flex-direction:column;min-width:0}
.m .frame{aspect-ratio:16/10;max-width:100%;display:flex;align-items:center;justify-content:center;background:var(--sunk);position:relative;overflow:hidden}
.m .frame img,.m .frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:var(--sunk)}
.m .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font-size:12px;text-align:center;padding:10px;text-decoration:none}
.m .ph svg{width:34px;height:34px}
.m .cap{padding:7px 10px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px solid var(--line);background:var(--panel)}
.m .cap span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .cap a{white-space:nowrap;font-size:12px}
.kind{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.empty{color:var(--mute);font-size:13px;padding:10px;border:1px dashed var(--line);border-radius:6px}
/* moats */
.moats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.moats article{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.moats h3{margin:0 0 4px;font-size:15px}.moats p{margin:0 0 6px;font-size:14px}
.moats .q{color:var(--mute);font-size:13px}.moats .ex{font-size:13px;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
/* drawer */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);z-index:21;overflow-y:auto;border-left:1px solid var(--line);
padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 20px}
.drawer h2{margin:4px 0 4px;font-size:24px}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sec{margin-top:20px}.sec>h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.srow{display:grid;grid-template-columns:96px 54px minmax(0,1fr);gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow b{font-size:13px}
.refs{margin:0;padding-left:18px;font-size:13px;word-break:break-all}
/* modal form */
.modal{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px));background:var(--shade)}
.modal form{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(820px,100%);padding:20px;display:grid;gap:14px}
.modal h2{margin:0}
.f{display:grid;gap:4px;min-width:0}.f label,.f .lb{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:7px 10px;font-size:14px;width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f small{color:var(--mute);font-size:12px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-weight:700;padding:0 6px;font-size:14px}
.sc{display:grid;grid-template-columns:110px 150px 34px minmax(0,1fr);gap:8px;align-items:center}
.sc input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.sc output{font-family:var(--mono);font-weight:600;text-align:center}
.sc textarea{min-height:38px;font-size:13px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.tagpick input{accent-color:var(--accent);width:auto}
.drow{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.4fr) auto;gap:6px;align-items:center}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;position:sticky;bottom:-20px;background:var(--panel);padding:12px 0 4px;border-top:1px solid var(--line)}
.err{color:var(--v-build);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
.land{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.seg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.seg header{display:flex;justify-content:space-between;align-items:baseline}.seg h3{margin:0;font-size:15px}.seg>p{margin:2px 0 10px;font-size:13px;color:var(--mute)}
.seg-me{border-color:var(--me-line)}
.plist{display:grid;gap:6px}
.pt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sunk)}
.pt:hover,.pt:focus-visible{border-color:var(--ink)}.pt.me{background:var(--me);border-color:var(--me-line)}
.pt .pn{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .bar80{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.pt .bar80 i{display:block;height:100%;background:var(--accent)}
.pt .pm{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--mute);border:1px solid var(--line)}
.pill.th-h{background:var(--s-none);color:var(--s-none-ink);border-color:transparent}.pill.th-m{background:var(--s-mid);color:var(--s-mid-ink);border-color:transparent}.pill.th-l{background:var(--s-strong);color:var(--s-strong-ink);border-color:transparent}
.files{display:grid;gap:6px}
.file{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.file img{width:40px;height:40px;object-fit:cover;border-radius:4px}
.file .ext{width:40px;height:40px;border-radius:4px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--mute)}
.file .fn{min-width:0;display:grid}.file .fn b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file .fn small{color:var(--mute);font-size:12px}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
@media (max-width:640px){.sc{grid-template-columns:90px minmax(0,1fr) 30px}.sc textarea{grid-column:1/-1}.drow{grid-template-columns:1fr 1fr}.drow input:nth-of-type(2){grid-column:1/-1}.filters{margin-left:0;width:100%}.filters input{flex:1}.srow{grid-template-columns:80px 48px minmax(0,1fr)}h1{font-size:25px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
/* landscape matrix */
.lhead{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-start;margin-top:8px}
.lhead h2{font-size:26px;margin:4px 0 6px;max-width:24ch;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:96px}
.kpi b{display:block;font-size:26px;font-family:var(--mono);font-weight:600;line-height:1.1}.kpi span{font-size:12px;color:var(--mute)}
.wc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px}
.wc-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.wc-top h3{margin:0;font-size:17px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap;align-items:center}
.lt{min-width:820px;border-collapse:separate;border-spacing:0}
.lt th,.lt td{border-bottom:1px solid var(--line);padding:7px 6px}
.lt td.r,.lt th.r{text-align:center;width:80px}
.lt .phase th{font-size:11px;letter-spacing:.08em;text-align:center;border-bottom:none;padding-bottom:2px}
.ph-w{background:var(--ph-w);color:var(--ph-w-ink)}.ph-c{background:var(--ph-c);color:var(--ph-c-ink)}.ph-d{background:var(--ph-d);color:var(--ph-d-ink)}
.lt tr.grp td{padding:10px 8px 6px;border-bottom:none}
.gbox{border-radius:7px;padding:7px 10px;font-size:13px;border:1px solid var(--line)}
.gbox b{font-size:13.5px;margin-right:8px}.gbox span{color:var(--mute);font-size:12.5px}
.g-work{background:var(--ph-w);border-color:transparent}.g-cand{background:var(--ph-c);border-color:transparent}.g-neigh{background:var(--ph-d);border-color:transparent}.g-crm{background:var(--sunk)}
.lt td.tn b{font-size:14px}.lt td.tn a{font-size:12px;margin-left:6px}.lt td.tn small{display:block;color:var(--mute);font-size:12.5px;max-width:64ch}
.lt tr.me td{background:var(--ph-w)}
.lt tr.row{cursor:default}.lt tr.row.ed{cursor:pointer}.lt tr.row.ed:hover td{background:var(--sunk)}
.dotr{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle}
.dotr.S{background:var(--teal)}.dotr.P{background:linear-gradient(90deg,var(--teal) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--teal)}
.dotr.N{width:10px;height:2px;border-radius:1px;background:var(--mute);opacity:.6}
.cards4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}

, YC Winter 2026, about 15 people. Complements RecruitSignals rather than competing.","me":false,"cat":"Scheduling","url":"https://tryvela.ai","scores":[4,6,3,5,3,2,0,2],"reasons":["Vela records a lot of scheduling emails and owns the anonymised version of them. That is real data, but it is about scheduling, not about which companies are hiring, and the numbers are Vela's own. Its benchmark reports 70,000+ emails and 7,000+ conversations (Nov 2025 to Aug 2026). Its contract (MSA clause 4.4) says Vela owns the anonymised usage data and may use it for benchmarking.","Customers simply copy Vela on an email thread, so it fits the way recruiters already work. The same ease means it is also easy to stop using. The home page and YC launch post say 'no dashboard, no new workflow'. It works over email, SMS, WhatsApp, calendars and Zoom, and handles reschedules and cancellations.","Vela shows a security logo but gives no proof of it. There is no certificate, no report and no Trust Center, so I treated the claim as unconfirmed. The home page shows an AICPA SOC logo with no text or link. The privacy notice, contract and terms never mention SOC 2, ISO or any certification, and no subprocessor list exists. Only a 99.5% uptime target is stated.","Vela has a good launch channel in Y Combinator and some well-known customers, and every email it sends shows its name to new people. All customer results are its own claims. Y Combinator Winter 2026, six firm logos on the home page, and five case studies: Riviera Partners, Paragon Legal, FirstLook Partners, a European HR firm and a W2 staffing firm (1,000+ interviews a week).","Vela connects to common tools but has no partner programme where other companies build on it. It works with Gmail, Outlook, Zoom, Slack and Teams. I found no marketplace or partner page, and the home FAQ's answer on an API did not load.","One customer's use does not help another customer. Product description. The only network-like effect is that candidates and clients on a thread get to know Vela.","It is software only. Nothing physical is involved.","Vela uses human executive assistants to guarantee accuracy, so costs grow with customers. It is also a small company. The /tldr page says accuracy is 'backed by certified Executive Assistants'. YC lists about 15 staff. Support is email only, weekdays 9am to 6pm."],"evidence":"Desk research, Nov 2026.","confidence":"Medium","tech":{"tags":["Email/calendar sync","Human analysts"],"cadence":"Per email thread","sources":"Email threads, SMS, WhatsApp, Slack and calendars. Own benchmark of 70,000+ scheduling emails.","collection":"Triggered when someone CCs Vela on a thread.","processing":"AI scheduling agent backed by human executive assistants.","output":"Booked interviews, reminders, reschedules.","pricing":"Demo only.","note":"","conf":"Medium"},"refs":["https://tryvela.ai/","https://tryvela.ai/benchmark"],"updatedAt":"2026-11-05","confs":["Medium","Medium","Low","Medium","Medium","Medium","High","Medium"]},{"id":"recruitcha-gtm","name":"Recruitcha GTM","summary":"Go-to-market signals for recruiters.","me":false,"cat":"Signal & lead gen","url":"https://www.recruitcha.ai","scores":[6,3,1,4,5,3,0,2],"reasons":["It collects market signals from public sources that others could also collect, so 6.","It is a feed more than a daily tool, so 3.","No proof of certificates or large funding, so 1.","Some reach among recruiters, so 4.","A few integrations, so 5.","Some sharing of market data across customers, so 3.","Software only.","A small company, so 2."],"evidence":"Recruitcha's website, read and re-audited with my consistency rules.","confidence":"Low","tech":{"tags":["ATS feed scanning","News & funding signals","Contact enrichment"],"cadence":"Daily","sources":"Scans 200,000+ jobs a day straight from 57+ ATS systems (Greenhouse, Lever, Workday, Ashby, BambooHR). Adds hiring-manager job changes, LinkedIn posts and funding events. Claims 580M+ hiring-manager profiles.","collection":"Daily ably not every day, so 5.","No certificates or large funding yet, so 1.","No strong channel of its own yet, so 3.","Few integrations so far, so 2.","Each customer works alone, so 1.","Software only.","A small team, so 2."],"evidence":"Your own description of the product. No outside evidence reviewed.","confidence":"Low","tech":{"tags":["Job-ad scraping","News & funding signals"],"cadence":"Add yours","sources":"Your pipeline. Edit this entry to describe where signals come from (job boards, career sites, Companies House, KvK, news).","collection":"Edit to add cadence and volumes.","processing":"Edit to add how signals are classified, de-duplicated and enriched.","output":"Hiring-signal leads for UK and NL agencies.","pricing":"","note":"","conf":"Low"},"refs":[],"updatedAt":"2026-11-05","confs":["Low","Low","Low","Low","Low","Low","Low","Low"]},{"id":"hirelytiq","name":"Hirelytiq","summary":"Early-stage hiring-signal tool.","me":false,"cat":"Signal & lead gen","url":"https://hirelytiq.com","scores":[4,3,1,3,1,1,0,1],"reasons":["It tracks some hiring signals, but I found nothing unique, so 4.","It is used occasionally, not daily, so 3.","No proof of certificates or funding, so 1.","Little reach, so 3.","Almost no integrations, so 1.","Each customer works alone, so 1.","Software only.","A very small team, so 1."],"evidence":"Hirelytiq's website, read and re-audited with my consistency rules.","confidence":"Low","tech":{"tags":["News & funding signals","LLM scoring"],"cadence":"Daily","sources":"Funding rounds, contract wins, leadership changes and expansion news. No vendor or job source named.","collection":"Daily niche view; claims signals appear weeks before roles are advertised.","processing":"Signals analysed and prioritised by AI. Method not described.","output":"Daily list of companies to contact and why.","pricing":"$150–$2,000/mo (third-party listing).","note":"","conf":"Low"},"refs":["https://alternativeto.net/software/hirelytiq/about"],"updatedAt":"2026-11-05","confs":["Low","Low","Low","Low","Low","Low","Low","Low"]},{"id":"flynt","name":"Flynt","summary":"Early-stage recruitment lead tool.","me":false,"cat":"Signal & lead gen","url":"https://tryflynt.ai","scores":[4,4,1,2,1,1,0,1],"reasons":["It collects some lead data, but I found nothing unique, so 4.","It is used when prospecting, so 4.","No proof of certificates or funding, so 1.","Little reach, so 2.","Almost no integrations, so 1.","Each customer works alone, so 1.","Software only.","A very small team, so 1."],"evidence":"Flynt's website, read and re-audited with my consistency rules.","confidence":"Low","tech":{"tags":["Job-ad scraping","News & funding signals","Contact enrichment","LLM scoring"],"cadence":"Daily","sources":"Jobs posted in the last 24 hours, funding and M&A news, people moves, and a database claiming 250M+ profiles and 30M+ companies. No vendor named.","collection":"Each agent runs daily and delivers up to 30 leads a day. Claims 600+ markets monitored.","processing":"Agents detect the signal, find the decision maker, enrich contacts, score the match with a written breakdown, and write personalised hooks from the job and news.","output":"Daily scored lead list with email, LinkedIn and triggering job, plus built-in email and LinkedIn sequences and pre-warmed inboxes.","pricing":"$99/mo (1 agent) to $399/mo (4 agents); 7-day trial.","note":"","conf":"Medium"},"refs":["https://flynt-website.web.app","https://flynt-website.web.app/faq","https://tryflynt.ai/pricing/"],"updatedAt":"2026-11-05","confs":["Low","Low","Low","Low","Low","Low","Low","Low"]},{"id":"juicebox","name":"Juicebox","summary":"AI candidate search (PeopleGPT) over 800M+ profiles licensed from 30+ data partners. Added Nov 2026.","me":false,"cat":"AI sourcing","url":"https://juicebox.ai","scores":[5,6,5,7,6,3,0,5],"reasons":["800M+ profiles from 30+ partner sources. Useful, but rivals can license the same data, so 5.","Recruiters search and run outreach in it daily, so 6.","Well known, funded company; I did not confirm audited certificates, so 5.","Strong self-serve growth with a free tier and big word of mouth, so 7.","Syncs with 100+ ATS and CRMs, so 6.","Agents learn from feedback, but mostly per customer, so 3.","Software only.","Large user base spreads data costs, so 5."],"evidence":"Desk research, Nov 2026.","confidence":"Medium","tech":{"tags":["Licensed people data","Contact enrichment","LLM scoring"],"cadence":"Daily to monthly","sources":"Candidate profiles, not job ads. 800M+ profiles compiled from 30+ partner sources. The site does not name vendors; team notes say the bulk data comes from People Data Labs (not confirmed on the site). 200M+ profiles carry email or phone. Adds GitHub, research and compensation data.","collection":"Profiles refreshed daily to monthly depending on the profile, refreshed on demand when an agent picks one, and within about 24 hours of a user report. Agents search the 30+ sources continuously for each open role.","processing":"Natural-language search replaces Boolean. Ranks candidates and writes fit summaries (AI-Spotlight). Infers skills. Agents learn from recruiter approvals, rejections and hiring-manager feedback. Models not named.","output":"Ranked candidate pools, CSV export, sync to 100+ ATS/CRMs (Greenhouse, Lever, Ashby, Bullhorn, JobAdder), AI email sequences sent from Gmail or Outlook, auto-shortlist and auto-email agents.","pricing":"Free; Starter about $99/seat/mo; Growth about $179/seat/mo; Agents add-on $199/agent/mo.","note":"","conf":"High"},"refs":["https://juicebox.ai/","https://juicebox.ai/pricing","https://peoplegpt.super.site/data-sources"],"updatedAt":"2026-11-05","confs":["Medium","Medium","Medium","Medium","Medium","Medium","Medium","Medium"]}],"landscape":{"eyebrow":"Recruitment landscape · October 2026","title":"Who helps agencies find work, and who helps them find candidates","subtitle":"Where RecruitSignals sits among the 32 tools we reviewed for UK and NL recruitment agencies, from vendor sites and press.","groups":[{"id":"work-signal","name":"Finding work: signal and BD platforms","desc":"Tell agencies which companies are hiring or about to","kind":"work"},{"id":"work-feeds","name":"Finding work: vacancy data feeds","desc":"Sell the data; the agency does the analysis","kind":"work"},{"id":"cand","name":"Finding candidates","desc":"Sourcing, matching and outreach","kind":"cand"},{"id":"neigh","name":"Neighbours: run, measure or support the desk","desc":"Not rivals on finding work, but they share the buyer","kind":"neigh"},{"id":"crm","name":"CRMs and ATSs: where the placement happens","desc":"The system of record; rated by category","kind":"crm"}],"tools":[{"id":"recruitsignals-us","group":"work-signal","name":"RecruitSignals (us)","url":"https://recruitsignals.com","note":"Shows companies hiring now or likely to hire soon, with alerts. Finds candidates in UK and NL data, or from your own uploads","r":["S","S","S","S","N","N"],"me":true},{"id":"hirelytiq","group":"work-signal","name":"Hirelytiq","url":"https://hirelytiq.com/uk","note":"Predicts which companies will hire, and when","r":["S","N","S","N","N","N"],"me":false},{"id":"vente-ai","group":"work-signal","name":"Vente AI","url":"https://vente.ai","note":"Shows companies that are posting jobs right now","r":["S","S","S","N","N","N"],"me":false},{"id":"recruitcha-gtm","group":"work-signal","name":"Recruitcha GTM","url":"https://recruitcha.ai","note":"Watches company career pages to spot new jobs","r":["S","N","S","N","N","N"],"me":false},{"id":"paiger-bd-module","group":"work-signal","name":"Paiger (BD module)","url":"https://paiger.co","note":"Finds leads and runs outreach inside Bullhorn","r":["S","S","S","N","N","N"],"me":false},{"id":"flynt","group":"work-signal","name":"Flynt","url":"https://tryflynt.ai","note":"Finds companies hiring or just funded, finds the decision-makers, and sends email and LinkedIn outreach","r":["S","S","S","N","N","N"],"me":false},{"id":"vacancysoft","group":"work-feeds","name":"Vacancysoft","url":"https://vacancysoft.com","note":"UK job feed with alerts","r":["S","N","N","N","N","N"],"me":false},{"id":"jobdigger","group":"work-feeds","name":"Jobdigger","url":"https://jobdigger.com","note":"Job data for the Netherlands and nearby countries","r":["S","N","N","N","N","N"],"me":false},{"id":"textkernel-market-iq","group":"work-feeds","name":"Textkernel Market IQ","url":"https://textkernel.com","note":"Job posting data from 15 markets. Also reads CVs and matches candidates","r":["S","N","N","S","N","N"],"me":false},{"id":"exa-search-api","group":"work-feeds","name":"Exa (search API)","url":"https://exa.ai","note":"Search tool developers use to pull job and people data","r":["N","N","N","S","N","N"],"me":false},{"id":"juicebox","group":"cand","name":"Juicebox","url":"https://juicebox.ai","note":"AI search to find candidates from 800M profiles","r":["N","N","N","S","S","N"],"me":false},{"id":"metaview","group":"cand","name":"Metaview","url":"https://metaview.ai","note":"Finds and screens candidates, and writes notes from calls","r":["N","N","N","S","S","N"],"me":false},{"id":"collective-work","group":"cand","name":"Collective.work","url":"https://collective.work/en","note":"Finds candidates from 800M profiles","r":["N","N","N","S","S","N"],"me":false},{"id":"sourcewhale","group":"cand","name":"SourceWhale","url":"https://sourcewhale.com","note":"Finds candidates and sends outreach. Connects to 68 CRMs and ATSs","r":["N","N","S","S","S","S"],"me":false},{"id":"spott","group":"crm","name":"Spott","url":"https://spott.io","note":"Recruitment CRM and ATS built around AI","r":["N","N","S","N","S","S"],"me":false},{"id":"pin","group":"cand","name":"Pin","url":"https://pin.com","note":"AI that finds candidates from 850M profiles, screens them and sends outreach","r":["N","N","N","S","S","N"],"me":false},{"id":"carv","group":"neigh","name":"Carv","url":"https://carv.com","note":"AI agents that do the routine work in high-volume hiring","r":["N","N","N","N","S","N"],"me":false},{"id":"ryvr-formerly-hinterview","group":"neigh","name":"ryvr (formerly Hinterview)","url":"https://ryvr.ai","note":"Records calls and puts the notes into your CRM","r":["N","N","N","N","N","N"],"me":false},{"id":"oneup-sales","group":"neigh","name":"OneUp Sales","url":"https://oneupsales.com","note":"Shows team performance with charts and leaderboards","r":["N","N","N","N","N","N"],"me":false},{"id":"rylo-formerly-recfindr","group":"neigh","name":"Rylo (formerly Recfindr)","url":"https://rylo.com","note":"Phone and meeting captioning app for Deaf users. Not a recruitment product","r":["N","N","N","N","N","N"],"me":false},{"id":"vela","group":"neigh","name":"Vela","url":"https://tryvela.ai","note":"AI that books interviews","r":["N","N","N","N","N","N"],"me":false},{"id":"bullhorn","group":"crm","name":"Bullhorn","url":"https://bullhorn.com","note":"The biggest recruitment CRM and ATS","r":["N","N","S","N","S","S"],"me":false},{"id":"jobadder","group":"crm","name":"JobAdder","url":"https://jobadder.com","note":"Recruitment CRM and ATS","r":["N","N","N","N","N","S"],"me":false},{"id":"vincere","group":"crm","name":"Vincere","url":"https://vincere.io","note":"Recruitment CRM and ATS in one. Searches your own candidates","r":["N","N","N","N","N","S"],"me":false},{"id":"loxo","group":"crm","name":"Loxo","url":"https://loxo.co","note":"Recruitment CRM and ATS with AI candidate search","r":["N","S","S","S","S","S"],"me":false},{"id":"recruiterflow","group":"crm","name":"Recruiterflow","url":"https://recruiterflow.com","note":"Recruitment CRM and ATS with automation and built-in AI sourcing","r":["N","N","S","S","S","S"],"me":false},{"id":"firefish","group":"crm","name":"Firefish","url":"https://firefishsoftware.com","note":"UK recruitment CRM. Searches your own candidates","r":["N","N","N","N","S","S"],"me":false},{"id":"recruit-crm","group":"crm","name":"Recruit CRM","url":"https://recruitcrm.io","note":"Recruitment CRM and ATS with AI sourcing and outreach","r":["N","N","S","S","S","S"],"me":false},{"id":"zoho-recruit","group":"crm","name":"Zoho Recruit","url":"https://zoho.com/recruit","note":"Recruitment ATS and CRM. Searches your own candidates","r":["N","N","N","N","N","S"],"me":false},{"id":"atlas","group":"crm","name":"Atlas","url":"https://recruitwithatlas.com","note":"AI recruitment CRM. Searches your own candidates","r":["N","N","N","N","S","S"],"me":false},{"id":"athena-crm","group":"crm","name":"Athena CRM","url":"https://athenacrm.io","note":"Recruitment CRM with AI and automation. Searches your own candidates","r":["N","N","N","N","N","S"],"me":false},{"id":"attio","group":"crm","name":"Attio","url":"https://attio.com","note":"General sales CRM with email outreach. Not made for recruiters","r":["N","N","S","N","N","N"],"me":false}],"cards":[{"k":"01 · Finding work","t":"Three kinds of rival","b":"Prediction (Hirelytiq), live-signal BD platforms (Vente AI, Recruitcha GTM, Paiger, Flynt) and vacancy feeds (Vacancysoft, Jobdigger, Textkernel). Of those we read, only Hirelytiq markets predicted hiring like we do. Big CRMs such as Bullhorn, JobAdder and Loxo are now adding prospecting tools too."},{"k":"02 · Finding candidates","t":"Crowded and well funded","b":"Juicebox has raised $116M, Metaview $110M and Collective.work about $8M. They compete with our candidate search (UK and NL data plus uploads), not with how we find work."},{"k":"03 · Distribution","t":"We are in nobody's catalogue","b":"Metaview, Carv and Jobdigger already plug into Bullhorn and other agency CRMs. None of the integration lists we read include RecruitSignals, and our own Bullhorn, JobAdder and Vincere links are still coming soon."},{"k":"04 · How agencies buy","t":"They stack tools","b":"Primis runs Paiger and SourceWhale together, OneUp links to both Spott and Atlas, and SourceWhale partners with Vente. The route to market is integrations and partners, not replacing the CRM."}],"strong":"Live and predicted jobs in one natural-language search, hiring-heat alerts when a company's score moves, and hiring-manager contacts with campaigns in the same app. Only Vente AI, Flynt and Hirelytiq come close, and each covers only part of that.","close":"Hirelytiq now tells almost the same story as us and has three regional sites. Our candidate search covers UK and NL only, next to Juicebox's 800M profiles. Bullhorn, JobAdder and Vincere integrations are not live yet.","crmNote":"Yes means the product's own website clearly shows the feature built in. Partner-only, vague or limited features count as No. Jobdigger, Vincere and Athena CRM could not be fully read, so their marks are unconfirmed.","footnote":"As of 2 November 2026. Ratings come from vendor websites, press and funding databases, and vendor claims are unverified. Left out: SmartDreamers (employer-side recruitment marketing) and Leadfacto (site not live)."},"analyses":[{"id":"spott","player":"Spott","url":"https://www.spott.io","threat":"","createdAt":"2026-11-05","updatedAt":"2026-11-05","sections":[{"id":"s1","title":"What Spott is, and who it is for","type":"text","addedAt":"2026-11-05","text":"Spott is one tool for recruitment agencies and in-house recruiters. It joins an ATS (your candidates, jobs and placements) with a CRM (your companies, contacts and deals). You add a job, and Spott finds and ranks the best candidates from your own database. It then follows them through a pipeline and records the placement and fee. Each person is saved once (as a candidate, a contact or both), so notes, emails and calls stay on one record. It replaces typing in CVs, cleaning duplicates, writing meeting notes and building reports by hand."},{"id":"s2","title":"How it works, step by step","type":"steps","addedAt":"2026-11-05","text":"The work goes in six steps, from job to placement. It can also start with a CRM deal. Automatic actions and AI help at every step.\nOften it starts in the CRM: a company, a contact, a deal. A won deal becomes a job.\nBehind every step: automatic actions when a person moves stage, and AI working on every record.","steps":[["Create job","client, needs, intake notes","Add the job and link the client company. Paste or upload the job description (link, PDF or Word). Add what you are looking for and your intake notes."],["Find people","AI match, ads, CV upload","Run AI Matching: first filters that must be met, then ranked wishes, each person scored 0-100 with a reason. Or advertise the job, or add CVs by upload, email, extension or CSV. Duplicates merge by themselves."],["Check","board, notes, meeting notes","Drag people through your own stages on a board. Write notes, let the Note Taker write up meetings, send follow-up campaigns and score interviews with scorecards."],["Show client","email, shortlist, client portal","Send them by email, as an AI-written Word shortlist (names can be hidden), or through the client portal where the client leaves comments. Book interviews from the calendar."],["Place","fee, dates, invoice","Choose a type (Contingent, Retained or Contract). Record the fee or rates, dates and splits (they must add up to 100%). Send an invoice draft to Xero."],["Report","dashboard, targets, Excel","The dashboard, targets and reports update from your activity, and you can export to Excel. Automations can close the job, send consent emails and create tasks."]]},{"id":"s3","title":"Features and how they work","type":"table","addedAt":"2026-11-05","cols":["Area","Feature","What it does, in simple words"],"rows":[["Add people","Upload CVs","Reads up to 1,000 CVs at once, even scans and photos. If there are fewer than 20, you check the details first. Drop them straight into a job stage or a list."],["Add people","CVs by email","Forward PDF or Word CVs to cv@spott.io (up to 250 per email). You become the main contact. If a CV fails, the error is emailed back."],["Add people","Re-uploaded CVs","If you upload a newer CV, only the changes are added. Spott also finds emails, phone numbers and LinkedIn links (costs credits) and keeps profiles up to date."],["Add people","Import and Chrome extension","Import CSV or Excel files; AI matches your columns to Spott fields. A Chrome extension adds people from LinkedIn. Email, phone and LinkedIn link must be unique, so duplicates are caught."],["Find people","Search and filters","Search with AND, OR and NOT. Filter by job title, experience, place (radius, area, ZIP), pay, last contact, reason for rejection and consent. Save your favourite searches as Views."],["Find people","Type a sentence to filter","Write something like \"React developer, 5+ years, California\" and Spott turns it into filters."],["Find people","AI Search tab","Describe the person you want, or start from a job. Filters narrow the list and AI ranks it 0-100. Accept, mark as reviewed, shortlist or share."],["Find people","Job matching","The same AI, started from a job. Results appear as they are found, as cards or a table, with history and export. It can also match one candidate to many jobs, or find people near a company."],["Find people","Bulk actions","Change a field, add to a list, job or campaign (up to 9,999 at a time), make a Word shortlist or send bulk email slowly."],["Jobs","Jobs and pipeline","Create a job by hand, from a link or from a file. Each job has tabs: Overview, Matching, Candidates, Campaigns, Advertising, Applicants, Portal, Files, Notes and Tasks, plus a board of stages."],["Jobs","Adverts and applicants","Post to the Spott job board, LinkedIn, Broadbean, idibu or VDAB. People who apply are scored by AI against the job."],["Jobs","Client portal and scorecards","The client sees a shortlist and comments live. AI drafts interview scorecards from your criteria and rates the answers from your interview notes."],["CRM","Companies, contacts, deals","Boards for deals. A deal can turn into a job. Adding a contact reuses a person you already have. Company details can be looked up. Group records in Lists."],["Placements","Placements","Three types: Contingent, Retained (paid in steps) and Contract (rates and margin). Fee splits, your own forms, and options for drop-out, change to permanent and extend."],["Placements","Timesheets, invoices, revenue","Approved timesheets and fees become invoices. Drafts go to Xero and the status comes back. See booked revenue, expected starters and gross profit."],["Talk","Shared inbox","Gmail or Outlook, WhatsApp and SMS in one place. Reply, schedule a send, use templates, get AI drafts, or send bulk emails one person at a time."],["Talk","Calendar and Note Taker","Sync your calendar and share booking links. A bot joins Zoom, Teams or Meet, writes everything down in any language, and gives you notes in 2 to 5 minutes."],["Talk","Calls, tasks, notes","Phone calls (Aircall, RingCentral, Ringover) are written out and mined for updates. Tasks have due dates and links. Notes can use templates."],["Reach out","Campaigns","Steps can be email, or a manual LinkedIn, call, WhatsApp or task step. Fill in names with variables or AI text. A campaign stops when someone replies. Limit: 125 emails a day per mailbox."],["Reach out","Marketing","Bulk email with open and click tracking, an unsubscribe link and a block list. You need a verified sending domain."],["AI","Ask AI and Ask Spott","Ask questions or give tasks on one record or the whole workspace. Changes need your approval. It searches emails, notes and calls, remembers your preferences and runs saved Skills."],["AI","AI columns","Write one instruction and AI fills a field for every record (1 credit per value)."],["Automate","Automations","About 28 triggers. Actions: send email, create a task, change a field, add a note, close job adverts. Use If/Then/Else, waits and AI conditions, and check the run logs."],["Report","Dashboard and reports","Boxes for numbers, lists, pipelines and charts. Targets are spread over working days. Funnels, time in each stage, and Excel export."],["Connect","Integrations, API, MCP","Phone systems, job boards, Xero, DocuSign, Creditsafe and SAP Fieldglass. A REST API and webhooks. An MCP server lets Claude and ChatGPT work with Spott."],["Admin","Roles, credits, mobile app","User permissions, two-step login and GDPR consent. 1,000 credits per user each month. iOS and Android app for search, notes and meeting recording."]]},{"id":"s4","title":"The AI parts of Spott","type":"table","addedAt":"2026-11-05","text":"AI is part of the core, not an extra. It reads your own records (notes, CVs, work history and call transcripts) and helps in seven areas.","cols":["AI area","What the AI does"],"rows":[["1. Match and search","Ranks your whole database from 0 to 100 for a job, using your notes, work history and call transcripts. Turns job text into filters and ranked wishes. Explains every score, and you can press thumbs up or down on each reason to correct it. The AI Search tab finds people from a plain description."],["2. Getting data in","Reads CVs into profiles, merges re-uploaded CVs and shows what changed, matches CSV columns, finds emails, phones and LinkedIn links, fills AI fields and scores people who apply."],["3. Ask Spott and Ask AI","Answers questions, searches emails, notes and calls by meaning, writes email drafts, and creates or moves records after you approve. Remembers your preferences and runs saved Skills."],["4. Meetings and calls","The Note Taker joins meetings, writes everything down in any language and makes notes from your templates. Call transcripts give suggested profile updates and tasks."],["5. Writing","Job descriptions, campaign emails for each person, AI blocks in email templates, interview scorecards and ratings, formatted CVs and Word shortlists."],["6. Automations","AI conditions, for example \"candidate has 5+ years of React\". People who apply are scored against the role."],["7. Other AI tools","The MCP server lets Claude, ChatGPT or Copilot search and update Spott. Each user signs in with their own account."]],"after":"Control and limits: admins can switch AI features on or off. Templates and prompts guide what the AI writes. Every AI change to your records needs your approval. Only Ask Spott can read email, and no AI reads WhatsApp. AI conditions are judgments, not exact checks. AI columns and finding contact details cost credits."}],"files":[{"name":"Spott_Report.pdf","type":"application/pdf","size":9897,"dataUrl":"data:application/pdf;base64,JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiAzIDAgUiAvRjMgNCAwIFIKPj4KZW5kb2JqCjIgMCBvYmoKPDwKL0Jhc2VGb250IC9IZWx2ZXRpY2EgL0VuY29kaW5nIC9XaW5BbnNpRW5jb2RpbmcgL05hbWUgL0YxIC9TdWJ0eXBlIC9UeXBlMSAvVHlwZSAvRm9udAo+PgplbmRvYmoKMyAwIG9iago8PAovQmFzZUZvbnQgL0hlbHZldGljYS1Cb2xkIC9FbmNvZGluZyAvV2luQW5zaUVuY29kaW5nIC9OYW1lIC9GMiAvU3VidHlwZSAvVHlwZTEgL1R5cGUgL0ZvbnQKPj4KZW5kb2JqCjQgMCBvYmoKPDwKL0Jhc2VGb250IC9UaW1lcy1Sb21hbiAvRW5jb2RpbmcgL1dpbkFuc2lFbmNvZGluZyAvTmFtZSAvRjMgL1N1YnR5cGUgL1R5cGUxIC9UeXBlIC9Gb250Cj4+CmVuZG9iago1IDAgb2JqCjw8Ci9Db250ZW50cyA5IDAgUiAvTWVkaWFCb3ggWyAwIDAgNTk1LjI3NTYgODQxLjg4OTggXSAvUGFyZW50IDggMCBSIC9SZXNvdXJjZXMgPDwKL0ZvbnQgMSAwIFIgL1Byb2NTZXQgWyAvUERGIC9UZXh0IC9JbWFnZUIgL0ltYWdlQyAvSW1hZ2VJIF0KPj4gL1JvdGF0ZSAwIC9UcmFucyA8PAoKPj4gCiAgL1R5cGUgL1BhZ2UKPj4KZW5kb2JqCjYgMCBvYmoKPDwKL1BhZ2VNb2RlIC9Vc2VOb25lIC9QYWdlcyA4IDAgUiAvVHlwZSAvQ2F0YWxvZwo+PgplbmRvYmoKNyAwIG9iago8PAovQXV0aG9yICgpIC9DcmVhdGlvbkRhdGUgKEQ6MjAyNjExMDMwNzAyMjMrMDAnMDAnKSAvQ3JlYXRvciAoXCh1bnNwZWNpZmllZFwpKSAvS2V5d29yZHMgKCkgL01vZERhdGUgKEQ6MjAyNjExMDMwNzAyMjMrMDAnMDAnKSAvUHJvZHVjZXIgKFJlcG9ydExhYiBQREYgTGlicmFyeSAtIFwob3BlbnNvdXJjZVwpKSAKICAvU3ViamVjdCAoXCh1bnNwZWNpZmllZFwpKSAvVGl0bGUgKFNwb3R0IFJlcG9ydCkgL1RyYXBwZWQgL0ZhbHNlCj4+CmVuZG9iago4IDAgb2JqCjw8Ci9Db3VudCAxIC9LaWRzIFsgNSAwIFIgXSAvVHlwZSAvUGFnZXMKPj4KZW5kb2JqCjkgMCBvYmoKPDwKL0ZpbHRlciBbIC9BU0NJSTg1RGVjb2RlIC9GbGF0ZURlY29kZSBdIC9MZW5ndGggODM1Nwo+PgpzdHJlYW0KR2F1SFFEMCtHa1A1X1VrZDU9cCpWM3RnUUkiMDdkM0NjWyc0PmlPO0QvXSxjY2hAR1ErY  want. Every day a Flynt \"agent\" (an automatic helper) looks for companies that are hiring. It finds the person who does the hiring, checks their work email, gives the lead a score from 0 to 100, and writes a personal email for you. Your leads, emails and replies all stay in one place: a CRM (a list of your leads) and an inbox."},{"id":"f2","title":"How it works, Part 1: finding leads","type":"steps","addedAt":"2026-11-05","text":"Each time the agent runs, your leads pass through seven stages. Flynt shows how many records survived each stage and, under \"Why N dropped\", why the rest were removed.\nThe agent does this by itself every day (numbers from a real run).","steps":[["Set up","You pick titles, places, industries",""],["Jobs","119 open jobs posted lately",""],["Companies","77 companies behind those jobs",""],["Good fit","44 fit your size and industry",""],["Managers","34 people who do the hiring",""],["Right title","10 have the job title you want",""],["Email","5 have a checked email",""],["Lead","5 scored leads (0-100) for you",""]]},{"id":"f3","title":"How it works, Part 2: reaching out","type":"steps","addedAt":"2026-11-05","text":"Starts when you connect a campaign and your own mailbox.","steps":[["Join campaign","New leads are added to your campaign",""],["AI writes","A personal email for each lead",""],["Emails sent","Up to 8 emails, from your mailbox, slowly",""],["Replies","Arrive in the Inbox with labels",""],["Deal board","Move the lead to Won, Lost and so on",""]]},{"id":"f4","title":"How it works, step by step","type":"text","addedAt":"2026-11-05","text":"1. Set up an agent. Pick the job titles you want (up to 5), the places (up to 6), the industries, and the size of company. You can also block words you do not want.\n2. The agent runs every day. It finds jobs posted in the last 24 hours and groups them by company. It keeps only companies that fit your size, industry and place, and skips recruitment agencies.\n3. It finds the right person. At each company it looks for the person who decides on hiring, such as a head of product. It then finds a work email and checks that it is real.\n4. It scores each lead. The score goes from 0 to 100. Under it, Flynt explains in plain words why the lead matched or did not match.\n5. You send emails. Connect the agent to a campaign. Flynt writes up to 8 emails for each lead and sends them slowly, in business hours. Nothing is sent until you connect your own mailbox.\n6. You follow the replies. Replies come into the Inbox with labels. You move each lead through simple stages and track deal value on a board."},{"id":"f5","title":"Features and how they work","type":"table","addedAt":"2026-11-05","cols":["Area","Feature","What it does, in simple words"],"rows":[["Agents","Hiring agent","Finds companies that just posted a job you care about. It runs by itself every day at the time you choose. In the trial it gives up to 5 leads a day for 7 days. \"Run Now\" starts an extra run (3 extra runs in the trial). If too few leads are found, Flynt loosens your filters a little. If your search is too narrow, that day's run is skipped."],["Agents","Funding agent (paid)","Finds companies that just raised money or were bought, before they announce jobs. Available on Pro, Growth and Scale, or as an add-on on Starter."],["Agents","Start from a candidate","Upload one candidate's CV and Flynt sets up the agent for you. It then writes each email around that candidate. You need one agent per candidate. The trial allows 3 uploads a day. (This comes from Flynt's chat helper; I did not try it.)"],["Agents","Setup screens","Five tabs: Agent Info (name, schedule), Jobs (titles, places, industries, full-time or remote), Companies (size, words to exclude), People (which job titles to contact), Campaign (where leads go)."],["Agents","Run report","Open any run to see all seven stages and how many records passed. \"Why N dropped\" gives reasons, such as: 14 companies in the wrong industry, 6 were recruitment agencies, 17 people with the wrong job title, 3 with no working email. \"Edit targeting\" takes you to the setting to change."],["Agents","Schedule and campaign link","Choose the daily run time and switch it on or off. You can send new leads straight into a campaign, or only have Flynt write the messages so you send them yourself by email or phone."],["Settings","Scoring preferences","Put six things in order of importance: the job they hire for, the manager's location, seniority, company size, industry, and recent funding. You can add a note, such as \"score newly promoted managers higher\"."],["Leads","Lead score","A score from 0 to 100 with a short summary, the reasons it is a good match, and a list of each point with a tick or a gap. You can press thumbs up or thumbs down to tell Flynt what you think."],["Leads","Lead card","Opens beside the list. It shows the person, their company, the job being advertised, a place for the email Flynt wrote, and a history of what happened. You also get their email, LinkedIn link and a \"Reveal phone number\" button. Company news needs a paid plan."],["Leads","Phone numbers","Free in the trial: click \"Reveal phone number\" on a lead. On a paid plan, an add-on finds about 900 numbers a month for $189 per agent on Starter."],["Campaigns","Emails written by AI","A campaign can have up to 8 emails (6 by default, sent on days 1, 2, 4, 7, 10 and 14; you can change the gaps). You do not write them. Flynt writes each one for each lead. You choose the tone (friendly, direct, professional or advising), add your own instructions, make a second version to compare, and preview examples. Check buttons test for rule and spam problems."],["Campaigns","Sending rules","Emails go from your own mailbox, on weekdays 9 to 5 (Eastern time), with a 10-minute gap between emails. Flynt sets a daily limit. You can slow the start for a new mailbox, set a minimum score, and the best leads are contacted first."],["Campaigns","Results","Shows how many leads were queued, contacted, opened, clicked, replied and became deals, and how each email step performed. You can rename, copy or delete a campaign."],["LinkedIn","LinkedIn messages (beta)","Sends connection requests and messages in the same plan as your emails. Locked in the trial; included on paid plans."],["Inbox","Shared inbox","Folders: Inbox, Sent, Reminders and Unread. Label replies as Lead, Not a lead, Interested, Not now or Not interested. Filter by campaign, or search by words, sender or receiver."],["CRM","Lead list","Search by name, email or company. Filter by date, by status, by what happened to the email (not contacted, opened, replied, bounced, unsubscribed) or by score group (Excellent 90-100, Great 75-89, Good 50-74, Poor below 50). Choose columns and download a CSV file."],["CRM","Lead status","Nine ready-made statuses: Lead, Interested, Meeting Booked, Meeting Completed, Won, Lost, No Show, Wrong Person and Not Interested. You can also create your own labels."],["CRM","Deal board","A board with one column per status. Each card shows a deal value (the default is $5,000, which you can change) with totals for open and won deals."],["Accounts","Email accounts","Connect a Gmail or other mailbox, or order new website names (.com or .org) and mailboxes from Flynt's \"My email orders\" page."],["Settings","Rules and alerts","Block companies or industries, skip companies you contacted in the last 3 months, get emails for new leads and good replies, and connect Slack."],["Help","Chat helper and videos","The Copilot chat answers questions from Flynt's help pages. Quick Start has 6 short videos: welcome, intro, agent setup, leads, campaigns with email setup, and Gmail setup. Help pages and support links are included."]]}],"files":[{"name":"Flynt_Report.pdf","type":"application/pdf","size":9989,"dataUrl":"data:application/pdf;base64,JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiAzIDAgUiAvRjMgNCA t solves: too much manual admin and scattered data. The AI writes notes, drafts emails, scores candidates and answers questions about your data."},{"id":"s2","title":"How it works, step by step","type":"steps","addedAt":"2026-11-11","text":"Atlas covers two jobs that recruiters do every week: winning clients (Part A) and filling the roles those clients give you (Part B).\nPart A, win a client (business development): Company, Contact, Opportunity (tracked in 7 stages), Campaign (emails, LinkedIn, calls, to-dos), Meeting (AI records and writes notes), Job (the client gives you a role to fill).\nPart B, fill the job (recruiting): Job post, AI criteria (scoring rules and personas), Find people (search your own database), Pipeline (7 stages), Client portal (a board or a one-page report), Placement (hired, and the fee is logged).","steps":[["Add your clients","company, contacts","Create a company (Client or Target) and add the people there. A person can be a Candidate, a Contact, or both."],["Track the sale","opportunity, 7 stages","Create an Opportunity. It moves through Identified, Pursuing, Initial request, Late Stage, then Converted or Lost. Outreach campaigns sit inside it."],["Open a job","job post, AI criteria","You need only a role name and a company. Paste a job description and Atlas AI turns it into screening rules and three search profiles."],["Find and move candidates","search, pipeline","Search your database and add people to the job. Move them through the pipeline from Sourcing to Hired."],["Reach out","campaigns, meeting AI","Campaigns send multi-step outreach. AI can draft each message. Meeting AI records calls and writes the notes for you."],["Close and measure","portal, fee, analytics","Share progress with the client, log the fee when someone is placed, and watch team numbers in Analytics."]]},{"id":"s3","title":"Features and how they work","type":"table","addedAt":"2026-11-11","cols":["Area","Feature","What it does, in simple words"],"rows":[["Home","Daily dashboard","A morning view with today's meetings, tasks, interviews, your jobs and campaign numbers. A timeline shows your focus. Buttons: \"Prep for next meeting\" and \"Recap last call\"."],["People","Candidate profile","Opens beside the list. Tabs: Overview, Jobs, Interviews, Files (resume upload), Compensation, Details, Activities, Atlas AI and Insights. You can send email, book a meeting, add a task or add the person to a list or a job."],["People","Search and import","\"New search\" has 12 filter groups: Role, Company, Location, Keywords, Profile info, Education, Seniority, Function, Industry, Compensation, Profile depth, Communication. There is also \"use AI text to filter\", saved views, and \"Past assessments\". Import takes Excel or CSV (or pasted table) for Candidates, Prospects or Clients. Export and column choice are at the top. The \"Get Chrome extension\" button (in Settings menu) installs an add-on that saves people and job leads from web pages in one click."],["Search","Quick search (Search)","A pop-up box to find any company, candidate, client or prospect. It lists recent items with Ctrl 1 to 4 shortcuts and has quick buttons for \"Create task\" and \"Schedule meeting\"."],["Jobs","Job workspace","Each job has Dashboard, Overview, Job description, Sourcing, Candidates, Client portal and Financials. Overview holds client, owner, team, place, salary notes and files."],["Jobs","AI job tools","Paste a job description, then \"Generate criteria\" to make scoring rules. Sourcing makes three search profiles (for example Fintech Python Core), each as \"Filters only\" or \"Filters + criteria\". \"AI redraft\" rewrites the description."],["Jobs","Candidate pipeline","Default stages: Sourcing, Internal IV, Presented, Client IV, Offer, Hired and Rejected, each with sub-steps (for example Scheduled, Sent, Signed, Past probation). You can edit them in Settings."],["Jobs","Placement (last step)","When a candidate reaches Hired (Signed, Started, Past probation), the placement shows in Permanent. You then add a fee on the job's Financials tab and link the placement."],["Jobs","Client portal","Two ways to share with your client, each with a live preview. Kanban board: choose stages to show (Presented to Hired), whether they see LinkedIn, references and resume download, and which columns. Executive report: a cover page with client logo, colour and summary, longlist and rejected sections, and optional automatic reporting."],["CRM","Companies and contacts","Company page shows contacts, people, jobs, placements, offices, files and terms of business. Contact page shows active jobs, placements, meetings and \"float\" candidates (people you offer to a client)."],["CRM","Opportunities","Two kinds: Business opportunity, and Candidate driven (built from one candidate). Tabs: Notes, Overview, Outreach, Prospects, Companies, Leads. An AI \"conversion probability\" panel starts once prospect activity exists. A Playbook page holds your sales method."],["Outreach","Campaigns (4 kinds)","Candidate outreach: find people for one specific job. General: send to a list of contacts. Candidate led: introduce one candidate to several contacts. Opportunity: a campaign inside a sales opportunity. Each is a sequence of steps with a delay: Email, LinkedIn connection, InMail, Phone call or To-do. \"AI draft\" writes a step, \"Send test emails\" previews it. Overview shows added, opened, replied, interested and presented."],["Meetings","Meeting AI","Paste a Meet, Teams or Zoom link, or pick a calendar event, and the AI notetaker joins, records and writes notes. You can also email notes@recruitwithatlas.com. \"Create meeting\" has attendees, \"Resolve with AI\" for dates, an Interview toggle, job link and \"Draft with AI\". Self-scheduling links let people book you."],["Work","Tasks and Lists","Tasks have three tabs: General, Candidate outreach and BD outreach, with due date, priority and recipient. Lists group people (default type: Candidate) and can be Private, Team or Company shared (view or edit)."],["Money","Permanent and Performance","Placements and Fees tables (by fee or by fee split), with export. Performance ranks consultants by fees. The job Financials tab adds a fee: type, currency, amount, status (starts as Projected), dates, notes for the invoice, several fee earners with roles, and a linked placement."],["Insight","Analytics","Five tabs. Activity: campaign, interview and time-to-hire numbers per person. Team (needs a team set up). Consultant: target cards. Analytics: type what you want to see and AI builds a dashboard. Active candidates: your live list."],["Settings","AI controls","\"Magic credits\" pay for AI actions: 100 per month free, 2,000 more for GBP 20 per month, or a 2,000 pack for GBP 29. \"AI Agent instructions\" set your writing style for candidates, reports, campaigns and interviews. \"Skills\" are your own saved AI instructions."],["Settings","Team and data","Users, job roles, permissions, custom attributes, blocked emails and domains, approvals, Signable docs (e-sign), terminology and design. Rules: auto-delete applicants after a set time and who may edit stages."],["Settings","Integrations","WhatsApp is on. Xero (accounting), Timesheet Portal, Claude, phone systems (RingCentral, RingOver, 8x8, AirCall, Devyce), job boards (Idibu, Broadbean, LogicMelon) and CoRecruit meeting notes can be connected. Optional modules: GDPR notices, public job page, contractor contracts, end clients. The Help button opens a chat with an AI agent and the Atlas team."]]},{"id":"s4","title":"The AI parts of Atlas","type":"table","addedAt":"2026-11-11","text":"What is the main AI-native part of Atlas? These are the AI features the report highlights.","cols":["AI feature","What it does"],"rows":[["Ask Atlas (chat assistant)","A chat box available on every page. You ask in plain words, for example \"Summarize my open tasks\", and it answers from the data already in your Atlas: the task, its due date, its priority and a link to the person. It can also read your emails and notes, so you do not search for things by hand."],["Job description to screening criteria","Paste a job description into a job, click \"Generate criteria\", and Atlas turns the text into a scoring checklist. It is then used to judge how well each candidate fits the role."],["Job description to search profiles","\"Generate personas\" reads the same text and suggests three different kinds of ideal candidate to search for. Each comes with a short reason and can be used as \"Filters only\" or \"Filters + criteria\"."],["Meeting notetaker","An AI notetaker can join a Meet, Teams or Zoom call, listen, and write the notes for you. You can invite it from any meeting in your calendar with one click."],["AI buttons across the app","\"AI draft\" writes a campaign message, \"Draft with AI\" and \"Resolve with AI\" help fill in the meeting form, \"use AI text to filter\" turns a sentence into People search filters, the Analytics box builds a dashboard from what you type, and the \"Atlas AI\" tab sits on each candidate profile."]]}],"files":[{"name":"Atlas_Report.pdf","type":"application/pdf","size":10652,"dataUrl":"data:application/pdf;base64,JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiAzIDAgUiAvRjMgNCAwIFIKPj4KZW5kb2JqCjIgMCBvYmoKPDwKL0Jhc2VGb250IC9IZWx2ZXRpY2EgL0VuY29kaW5nIC9XaW5BbnNpRW5jb2RpbmcgL05hbWUgL0YxIC9TdWJ0eXBlIC9UeXBlMSAvVHlwZSAvRm9udAo+PgplbmRvYmoKMyAwIG9iago8PAovQmFzZUZvbnQgL0hlbHZldGljYS1Cb2xkIC9FbmNvZGluZyAvV2luQW5zaUVuY29kaW5nIC9OYW1lIC9GMiAvU3VidHlwZSAvVHlwZTEgL1R5cGUgL0ZvbnQKPj4KZW5kb2JqCjQgMCBvYmoKPDwKL0Jhc2VGb250IC9UaW1lcy1Sb21hbiAvRW5jb2RpbmcgL1dpbkFuc2lFbmNvZGluZyAvTmFtZSAvRjMgL1N1YnR5cGUgL1R5cGUxIC9UeXBlIC9Gb250Cj4+CmVuZG9iago1IDAgb2JqCjw8Ci9Db250ZW50cyA5IDAgUiAvTWVkaWFCb3ggWyAwIDAgNTk1LjI3NTYgODQxLjg4OTggXSAvUGFyZW50IDggMCBSIC9SZXNvdXJjZXMgPDwKL0ZvbnQgMSAwIFIgL1Byb2NTZXQgWyAvUERGIC9UZXh0IC9JbWFnZUIgL0ltYWdlQyAvSW1hZ2VJIF0KPj4
