<script>
const M=["Data","Workflow","Regulatory","Distribution","Ecosystem","Network","Physical","Scale"];
const MP=[
["Does it own information others can't get?","If a rival can scrape or buy the same data, there is no moat.","Strong: exclusive data nobody else holds. Weak: public data anyone can collect.","Collect data only your customers' use of the product creates, and keep it exclusive."],
["Is it part of the customer's daily routine?","The more a team's work runs through it, the more it hurts to switch.","Strong: the team lives in it every day. Weak: a tool people open now and then.","Connect it to the places the team already works, so removing it breaks their routine."],
["Does it hold licences, security certificates, big capital or contracts?","These take months or years to get, and big customers ask for them.","Strong: audited certificates (SOC 2 Type II, ISO 27001) plus big funding. Weak: a young company with only self-claimed security.","Complete an audited certificate, publish a Trust Center, and raise or earn more capital."],
["Can it reach customers without paying for every click?","Its own audience, partners, brand or built-in sharing.","Strong: customers come on their own through a big channel it controls. Weak: relies on ads and cold outreach.","Build an audience, referral loop or partner channel that brings customers on its own."],
["Do other companies build on it or plug into it?","Every integration makes it more useful and harder to leave.","Strong: many named partners and an open marketplace. Weak: a few connections it built itself.","Open an API and a partner marketplace, and list the named partners publicly."],
["Does it get better as more people join?","Like a marketplace: more buyers attract more sellers.","Strong: each new user improves it for the others. Weak: each customer is on their own.","Pool anonymous results across customers so each new customer improves the product for all."],
["Does it need real-world things?","Hardware, offices, cables, warehouses.","Strong: it owns assets that are slow and costly to copy. Weak: pure software, copied in a weekend.","Rarely applies to software. A score near 0 is normal and not a flaw."],
["Does being big make it cheaper to run?","Lower cost per customer lets it undercut a newcomer.","Strong: size gives it a clear cost edge. Weak: costs grow in line with customers.","Automate delivery so each extra customer costs little to serve."]];
const BP={Strong:"hard for a rival to copy",Emerging:"started, but a rival could still catch up",None:"almost nothing here yet"};
const CATS=["Signal & lead gen","AI sourcing","ATS & CRM","Conversation intelligence","Data infrastructure","Scheduling","Other"];
const TAGS=["Job-ad scraping","Career-site monitoring","ATS feed scanning","Company registry","News & funding signals","Licensed people data","Own people graph","Own web index","Customer CRM data","Email/calendar sync","Call & meeting capture","Contact enrichment","LLM scoring","Human analysts"];
const STEPS=["Find jobs","Hiring manager","Win client","Find candidates","Match and reach","Place and admin"];
const RT={S:"Strong",P:"Partial or limited",N:"None in what we read"};
const band=s=>s>=7?"Strong":s>=4?"Emerging":"None";
const bc=s=>s>=7?"c-strong":s>=4?"c-mid":"c-none";
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const slug=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
const uid=n=>slug(n)+"-"+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- state & storage (no database: data lives in the page, your browser and your files) ---------- */
const PRISTINE=document.body.innerHTML;
const SEED=(()=>{try{return JSON.parse(document.getElementById("seed").textContent)}catch(e){return {}}})();
function normalize(d){d=d||{};if(Array.isArray(d))d={players:d};return {publishedAt:d.publishedAt||"",players:d.players||[],landscape:d.landscape||clone(SEED.landscape||{groups:[],tools:[],cards:[]}),analyses:d.analyses||[],demos:d.demos||[],notes:d.notes||[],log:d.log||[],meta:d.meta||{}}}
let BASE=SEED.publishedAt,FILEDATA=null;
let S=normalize(clone(SEED)),mode="loading",savedAt="",staleLocal=null,downloads=null,artifactCap=null,isEditor=false,openCell=null,drawerId=null,draft=null,draftKind=null;
const state={q:""};
const LS="rsbrain.draft.v2";
let _idb;function idb(){if(_idb!==undefined)return _idb;_idb=new Promise(res=>{try{const q=indexedDB.open("rs-brain",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});return _idb}
async function lsGet(){const db=await idb();if(db){try{const v=await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(LS);q.onsuccess=()=>res(q.result);q.onerror=rej});if(v!==undefined)return v}catch(e){}}try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
async function lsSet(v){const db=await idb();if(db){try{await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,LS);t.oncomplete=res;t.onerror=rej});return true}catch(e){}}try{localStorage.setItem(LS,JSON.stringify(v));return true}catch(e){return false}}
async function lsDel(){const db=await idb();if(db){try{await new Promise(res=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(LS);t.oncomplete=res;t.onerror=res})}catch(e){}}try{localStorage.removeItem(LS)}catch(e){}}
async function boot(){
  const onClaude=!!(window.claude&&window.claude.use);
  let file=null;if(!onClaude){try{const r=await fetch("rs-brain.json",{cache:"no-store"});if(r.ok)file=await r.json()}catch(e){}}
  if(file){BASE=file.publishedAt||"file";FILEDATA=file;S=normalize(clone(file))}
  const local=await lsGet();
  if(local&&local.data&&local.base===BASE){S=normalize(local.data);savedAt=local.savedAt||"";mode="local"}
  else{const strip=d=>JSON.stringify({...normalize(d),publishedAt:""});if(local&&local.data){if(strip(local.data)===strip(S))lsDel();else staleLocal=local}mode="original"}
  render();
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(d=>{downloads=d}).catch(()=>{});
    window.claude.use("artifact").then(a=>{artifactCap=a;render()}).catch(()=>{});
    window.claude.use("user").then(async u=>{try{isEditor=u?await u.canEdit():false}catch(e){isEditor=false}render()}).catch(()=>{});
  }
}
function persist(){savedAt=new Date().toISOString().slice(0,16).replace("T"," ");mode="local";
  lsSet({savedAt,base:BASE,data:S}).then(ok=>{if(!ok)toast("Browser storage is full or blocked. Save to a file to keep your changes.")});render()}
function resetOriginal(){lsDel();S=normalize(clone(FILEDATA||SEED));mode="original";savedAt="";render();toast("Back to the published version")}
const RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
async function publishForEveryone(){
  const btn=$("#pubBtn");if(btn)btn.disabled=true;
  const stamp=new Date().toISOString().slice(0,16).replace("T"," ");
  const json=JSON.stringify({...S,publishedAt:stamp}).replace(/<\//g,"<\\/");
  const open='<script type="application/json" id="seed">',a=PRISTINE.indexOf(open)+open.length,b=PRISTINE.indexOf("</"+"script>",a);
  const doc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+PRISTINE.slice(0,a)+json+PRISTINE.slice(b)+'<'+'/body></html>';
  if(doc.length>15.5*1024*1024){toast("Too much data to publish (over 15 MB). Remove some attached files.");if(btn)btn.disabled=false;return}
  const backup=await lsGet();await lsDel();
  try{await artifactCap.publish(doc);toast("Published. Everyone with the link now sees this version.")}
  catch(e){if(backup)await lsSet(backup);if(btn)btn.disabled=false;
    if(e&&(e.code==="not_writer"||e.code==="not_granted")){isEditor=false;render();toast("Only editors of this page can publish.")}
    else if(e&&e.code==="conflict")toast("Someone published a newer version first. Reloading it.");
    else toast("Publish failed. Your draft is still in this browser.")}
}
async function saveFile(){
  const json=JSON.stringify({...S,publishedAt:new Date().toISOString().slice(0,16).replace("T"," ")},null,1),name="rs-brain.json";
  if(downloads){try{await downloads.save({filename:name,data:json});toast("Saved "+name)}catch(e){toast("File not saved")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Saved "+name);
}
function loadFile(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!(Array.isArray(d)||d.players||d.landscape))throw 0;S=normalize(d);persist();toast("Loaded "+f.name)}catch(e){toast("That file is not an RS-Brain export")}};r.readAsText(f)}
async function blobSave(name,dataUrl,type){const b64=(dataUrl.split(",")[1]||""),bin=atob(b64),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);const blob=new Blob([u],{type:type||"application/octet-stream"});
  if(downloads){try{await downloads.save({filename:name,data:blob})}catch(e){toast("File not saved")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1400/img.width);const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

/* ---------- shell ---------- */
const VIEWS=["home","landscape","compare","moats","analysis","notes","data","log"];
function route(){const h=(location.hash||"").slice(1);if(h.startsWith("analysis-"))return "analysis";return VIEWS.includes(h)?h:"home"}
const curA=()=>{const h=(location.hash||"").slice(1);return h.startsWith("analysis-")?S.analyses.find(a=>a.id===h.slice(9)):null};
const ADDLABEL={home:"",landscape:"+ Add tool",compare:"",moats:"+ Add player",analysis:"+ Add product",notes:"+ Add note",data:"+ Add player",log:""};
const has=(...xs)=>!state.q||xs.join(" ").toLowerCase().includes(state.q.toLowerCase());
function render(){
  const v=route();
  document.querySelectorAll("#tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const ab=$("#addBtn");ab.textContent=v==="analysis"&&curA()?"+ Add section":ADDLABEL[v];ab.hidden=mode==="loading"||!ab.textContent;
  if(v==="log"){seenBase();markSeen()}
  renderStats();
  const el=$("#view");if(mode==="loading"){el.innerHTML='<p class="empty" style="margin-top:20px">Loading…</p>';return}
  const V={home:viewHome,landscape:viewLandscape,compare:viewCompare,moats:viewMoats,analysis:viewAnalysis,notes:viewNotes,data:viewData,log:viewLog};
  el.innerHTML=(V[v]||viewHome)();
  if(drawerId)renderDrawer();
}
const TITLES={home:["Home","What matters right now"],compare:["Compare","Up to four companies side by side"],notes:["Notes","What the team has learned about each company"],log:["What's new","Every change, newest first"],landscape:["Recruitment landscape","Who helps agencies find work, and who helps them find candidates"],moats:["Moat analysis","How hard each player is to copy when AI makes building cheap"],analysis:["Product analysis","Our own analysis of each product we have studied"],data:["Data & tech","How each player gets and processes its data"]};
function renderStats(){
  if(mode==="loading")return;
  const local=mode==="local";
  const C={home:"",landscape:(S.landscape.tools||[]).length,compare:"",moats:S.players.length,analysis:S.analyses.length,notes:(S.notes||[]).length,data:S.players.length,log:newCount()||""};
  document.querySelectorAll("[data-count]").forEach(el=>el.textContent=C[el.dataset.count]??"");
  const v=route(),a=v==="analysis"&&curA();$("#pageTitle").textContent=a?a.player:TITLES[v][0];$("#pageSub").textContent=a?"Product analysis":TITLES[v][1];
  $("#stats").innerHTML=`<div class="status ${local?"draft":"pub"}"><span class="sdot"></span><span><b>${local?"Draft":"Published"}</b><small>${local?"Only in this browser"+(savedAt?" · "+esc(savedAt):""):esc(BASE&&BASE!=="file"?BASE:"")}</small></span></div>${local&&artifactCap&&isEditor?`<button class="btn pri wide" type="button" id="pubBtn">Publish for everyone</button>`:""}${local&&!artifactCap?`<button class="btn pri wide" type="button" id="dlBtn">Download data file</button><small class="hint">Upload it to GitHub as rs-brain.json to update the site.</small>`:""}${local?`<button class="btn wide ghost" type="button" id="resetBtn">Discard draft</button>`:""}`+
  (staleLocal?`<div class="note">A newer version was published. Your older draft was set aside.<div class="acts" style="margin-top:6px"><button class="btn sm" type="button" id="keepStale">Use my draft</button><button class="btn sm" type="button" id="dropStale">Discard</button></div></div>`:"");
}

/* ---------- 1. landscape ---------- */
const dot=r=>`<span class="dotr ${r||"N"}" role="img" aria-label="${RT[r||"N"]}" title="${RT[r||"N"]}"></span>`;
function viewLandscape(){
  const L=S.landscape,T=(L.tools||[]),G=L.groups||[];
  const others=T.filter(t=>!t.me),kindOf=t=>(G.find(g=>g.id===t.group)||{}).kind;
  const nWork=others.filter(t=>kindOf(t)==="work").length,nCand=others.filter(t=>kindOf(t)==="cand").length;
  let h=`<div class="lhead"><div><div class="eyebrow">${esc(L.eyebrow||"")}</div><h2>${esc(L.title||"Recruitment landscape")}</h2><p class="lede">${esc(L.subtitle||"")}</p></div>
   <div class="kpis"><div class="kpi"><b>${T.length}</b><span>tools reviewed</span></div><div class="kpi"><b>${nWork}</b><span>sell job or hiring data</span></div><div class="kpi"><b>${nCand}</b><span>sell candidate finding</span></div></div></div>`;
  h+=`<section class="wc"><div class="wc-top"><h3>Workflow coverage</h3><div class="legend"><span>${dot("S")} Yes: built in</span><span>${dot("N")} No, or not in what we read</span>${canEditHint()}</div></div>
  <div style="overflow-x:auto;margin-top:8px"><table class="lt"><thead><tr class="phase"><th></th><th colspan="3" class="ph-w">FINDING WORK</th><th colspan="2" class="ph-c">FINDING CANDIDATES</th><th class="ph-d">DOING</th></tr>
  <tr><th style="padding-left:8px">Tool and what it is</th>${STEPS.map(s=>`<th class="r">${s}</th>`).join("")}</tr></thead><tbody>`;
  G.forEach(g=>{const rows=T.filter(t=>t.group===g.id&&has(t.name,t.note));if(!rows.length&&state.q)return;
    h+=`<tr class="grp"><td colspan="7"><div class="gbox g-${esc(g.kind||"crm")}"><b>${esc(g.name)}</b><span>${esc(g.desc||"")}</span></div></td></tr>`;
    rows.forEach(t=>{h+=`<tr class="row ed ${t.me?"me":""}" data-tool="${esc(t.id)}" tabindex="0"><td class="tn" style="padding-left:12px"><b>${esc(t.name)}</b>${statusPill(t.name)}${safeUrl(t.url)?`<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(host(t.url))} ↗</a>`:""}<small>${esc(t.note||"")}</small></td>${STEPS.map((_,i)=>`<td class="r">${dot((t.r||[])[i])}</td>`).join("")}</tr>`});
  });
  h+=`</tbody></table></div>${L.crmNote?`<p class="foot2">${esc(L.crmNote)}</p>`:""}</section>`;
  if((L.cards||[]).length)h+=`<div class="cards4">${L.cards.map(c=>`<article><div class="eyebrow">${esc(c.k)}</div><h4>${esc(c.t)}</h4><p>${esc(c.b)}</p></article>`).join("")}</div>`;
  if(L.strong||L.close)h+=`<div class="sc2"><div><h4>Where RecruitSignals is strong</h4><p>${esc(L.strong||"")}</p></div><div><h4>What to close</h4><p>${esc(L.close||"")}</p></div></div>`;
  h+=`<div class="xlinks"><button class="btn sm" type="button" id="editInsights">Edit headline, insights and notes</button></div>`;
  if(L.footnote)h+=`<p class="foot2">${esc(L.footnote)}</p>`;

}

const PV={},PDFURL=new Map();
const isPdf=f=>!!f&&(/pdf/i.test(f.type||"")||/\.pdf(\?|$)/i.test(f.name||"")||/\.pdf(\?|$)/i.test(f.url||"")||/^data:application\/pdf/.test(f.dataUrl||""));
function pdfSrc(f){if(f.dataUrl){const key=(f.name||"")+"|"+(f.size||0)+"|"+f.dataUrl.length+"|"+f.dataUrl.slice(-48);let u=PDFURL.get(key);if(!u){try{const b64=f.dataUrl.split(",")[1]||"",bin=atob(b64),arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);u=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));PDFURL.set(key,u)}catch(e){return ""}}return u}return safeUrl(f.url)}
function pdfView(a){const L=(a.files||[]).map((f,i)=>({f,i})).filter(x=>isPdf(x.f));

  ${src?`<iframe class="pdfframe" src="${esc(src)}#view=FitH" title="${esc(cur.f.name||"PDF")}"></iframe><p class="pdfnote">This is the file exactly as uploaded. If it does not show here, use "Open in new tab".</p>`:`<div class="emptybig"><b>Could not display this PDF</b>Use Download or Open in new tab.</div>`}`}

function viewData(){
  const P=rows().map(r=>r.p).filter(p=>has(...pHay(p)));
  const used=TAGS.concat([...new Set(P.flatMap(p=>(p.tech||{}).tags||[]))].filter(t=>!TAGS.includes(t))).filter(t=>P.some(p=>((p.tech||{}).tags||[]).includes(t)));
  let h=`<h2>How each player gets and processes its data</h2><p class="lede">Filled squares show which methods a player uses. Read across for one pipeline, or down a column to see who shares a method. Click a name for the full write-up.</p>`;
  h+=`<div class="scroll"><table class="mx"><thead><tr><th style="padding-left:12px">Player</th><th>Cadence</th>${used.map(t=>`<th class="r">${esc(t)}</th>`).join("")}</tr></thead><tbody>`;
  P.forEach(p=>{const t=p.tech||{},tg=t.tags||[];h+=`<tr class="${p.me?"me":""}"><td class="nm" style="padding-left:12px"><button type="button" data-open="${esc(p.id)}">${esc(p.name)}${p.me?" (you)":""}</button><small>${esc(p.cat||"")}</small></td><td class="cad">${esc(t.cadence||"–")}</td>${used.map(x=>`<td class="dot ${tg.includes(x)?"":"n"}" title="${esc(x)}"><span></span></td>`).join("")}</tr>`});
  h+=`</tbody></table></div><h2>Pipeline write-ups</h2><div class="tcards">`+P.map(p=>{const t=p.tech||{};return `<article class="tc ${p.me?"me":""}"><header><h3><button type="button" data-open="${esc(p.id)}">${esc(p.name)}</button></h3><span class="cad">${esc(t.cadence||"")}</span></header><div class="tags">${(t.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><dl class="kv"><dt>Data from</dt><dd>${esc(t.sources||"–")}</dd><dt>Collected</dt><dd>${esc(t.collection||"–")}</dd><dt>Processed</dt><dd>${esc(t.processing||"–")}</dd><dt>Delivers</dt><dd>${esc(t.output||"–")}</dd></dl>${t.note?`<div class="note">${esc(t.note)}</div>`:""}</article>`}).join("")+`</div>`;
  return h;
}

function readAndSave(){
  syncRows();const d=draft;const now=new Date().toISOString().slice(0,10);let L="";
  if(draftKind==="analysis"||draftKind==="demos"){d.player=g("f-player").value.trim();if(!d.player)return "Name the product."}
  if(draftKind==="analysis"){d.url=g("f-url").value.trim();d.threat=g("f-th").value;touchA(d);readMeta(d.player);L=(d.id?"Product analysis edited: ":"New product page: ")+d.player;
    if(!d.id){logChange(L);let id=slug(d.player),n=2;while(S.analyses.some(x=>x.id===id))id=slug(d.player)+"-"+n++;d.id=id;d.createdAt=now;S.analyses.push(d);persist();location.hash="analysis-"+id;return ""}else S.analyses[S.analyses.findIndex(x=>x.id===d.id)]=d}
  else if(draftKind==="alink"){const a=curA(),u=g("f-lurl").value.trim();if(!safeUrl(u))return "Paste a full link starting with https://";a.files=a.files||[];a.files.push({name:g("f-lname").value.trim()||host(u),url:u,addedAt:now});touchA(a);L=a.player+": link added to files"}
  else if(draftKind==="section"){const a=curA();d.title=g("f-stitle").value.trim();if(!d.title)return "Give the section a title.";d.type=g("f-stype").value;d.text=g("f-stext").value.trim();
    const split=l=>l.split("|").map(c=>c.trim());
    if(d.type==="table"){d.cols=split(g("f-scols").value).filter(Boolean);d.rows=g("f-srows").value.split("\n").filter(l=>l.trim()).map(split);d.after=g("f-safter").value.trim()}else{delete d.cols;delete d.rows;delete d.after}
    if(d.type==="steps"){d.steps=g("f-ssteps").value.split("\n").filter(l=>l.trim()).map(split)}else delete d.steps;
    L=a.player+": "+(secIdx==null?"new section \""+d.title+"\"":"section \""+d.title+"\" edited");if(secIdx==null){d.id="s"+Math.random().toString(36).slice(2,8);d.addedAt=now;a.sections.push(d)}else a.sections[secIdx]=d;touchA(a)}
  else if(draftKind==="demos"){d.url=g("f-url").value.trim();d.unique=g("f-uni").value.split("\n").map(x=>x.trim()).filter(Boolean);d.notes=g("f-no").value.trim();d.media=d.media.filter(m=>m.dataUrl||safeUrl(m.url));
    L=(d.id?"Demos edited: ":"New demo set: ")+d.player;if(!d.id){d.id=uid(d.player);S.demos.push(d)}else S.demos[S.demos.findIndex(x=>x.id===d.id)]=d}
  else if(draftKind==="tool"){d.name=g("f-name").value.trim();if(!d.name)return "Name the tool.";d.url=g("f-url").value.trim();d.group=g("f-grp").value;d.note=g("f-note").value.trim();d.r=STEPS.map((_,i)=>g("f-r"+i).value);d.me=g("f-me").checked;
    readMeta(d.name);L=(d.id?"Landscape: "+d.name+" edited":"Landscape: "+d.name+" added");const T=S.landscape.tools;if(!d.id){d.id=uid(d.name);T.push(d)}else T[T.findIndex(x=>x.id===d.id)]=d}
  else if(draftKind==="note"){d.company=g("f-nco").value.trim();d.text=g("f-ntx").value.trim();d.author=g("f-nau").value.trim();if(!d.company)return "Pick the company.";if(!d.text)return "Write the note.";if(d.author)setMyName(d.author);S.notes=S.notes||[];const stamp=new Date().toISOString().slice(0,16).replace("T"," ");if(!d.id){d.id="n"+Math.random().toString(36).slice(2,9);d.at=stamp;S.notes.push(d);L="Note added on "+d.company+(d.author?" by "+d.author:"")}else{d.edited=true;S.notes[S.notes.findIndex(x=>x.id===d.id)]=d;L="Note edited on "+d.company}}
  else if(draftKind==="insights"){L="Landscape headline and insights edited";const L=S.landscape;L.eyebrow=g("f-eb").value.trim();L.title=g("f-ti").value.trim();L.subtitle=g("f-sub").value.trim();(L.cards||[]).forEach((c,i)=>{c.k=g("f-ck"+i).value.trim();c.t=g("f-ct"+i).value.trim();c.b=g("f-cb"+i).value.trim()});L.strong=g("f-strong").value.trim();L.close=g("f-close").value.trim();L.crmNote=g("f-crm").value.trim();L.footnote=g("f-foot").value.trim()}
  else if(draftKind==="player"){d.name=g("f-name").value.trim();if(!d.name)return "Name the player.";d.cat=g("f-cat").value;d.url=g("f-url").value.trim();d.summary=g("f-sum").value.trim();d.scores=M.map((_,i)=>+g("f-s"+i).value);d.reasons=M.map((_,i)=>g("f-rs"+i).value.trim());d.evidence=g("f-ev").value.trim();d.confidence=g("f-conf").value;d.me=g("f-me").checked;
    const tags=[...document.querySelectorAll('input[name=tag]:checked')].map(x=>x.value).concat(g("f-tagx").value.split(",").map(x=>x.trim()).filter(Boolean));
    d.tech={tags:[...new Set(tags)],cadence:g("f-cad").value.trim(),pricing:g("f-pr").value.trim(),sources:g("f-src").value.trim(),collection:g("f-col").value.trim(),processing:g("f-proc").value.trim(),output:g("f-out").value.trim(),note:g("f-tnote").value.trim()};
    d.refs=g("f-refs").value.split("\n").map(x=>x.trim()).filter(safeUrl);d.updatedAt=now;
    L=(d.id?"Moat scores edited: ":"New moat-scored player: ")+d.name;if(!d.id){let id=slug(d.name),n=2;while(S.players.some(p=>p.id===id))id=slug(d.name)+"-"+n++;d.id=id;S.players.push(d)}else S.players[S.players.findIndex(x=>x.id===d.id)]=d}
  if(L)logChange(L);persist();return "";
}
function removeDraft(){const id=draft.id;
  if(draftKind==="note"){logChange("Note removed on "+draft.company);S.notes=S.notes.filter(n=>n.id!==id);persist();return}
  logChange("Removed: "+(draft.player||draft.name||draft.title||draft.company||"item"));

function positionChart(){

  pts.forEach(p=>{const k=p.x+"|"+p.y;seen[k]=(seen[k]||0)+1;p.k=seen[k]-1});
  const grid=[0,2,4,6,8,10].map(v=>`<line x1="${sx(v)}" y1="${P.t}" x2="${sx(v)}" y2="${H-P.b}" class="gl"/><line x1="${P.l}" y1="${sy(v)}" x2="${W-P.r}" y2="${sy(v)}" class="gl"/><text x="${sx(v)}" y="${H-P.b+18}" text-anchor="middle" class="tk">${v}</text><text x="${P.l-10}" y="${sy(v)+4}" text-anchor="end" class="tk">${v}</text>`).join("");
  const grp={};pts.forEach(p=>{const k=p.x+"|"+p.y;(grp[k]=grp[k]||[]).push(p)});
  const placed=[];Object.values(grp).forEach(list=>{const n=list.length,bx=sx(list[0].x),by=sy(list[0].y);list.forEach((p,i)=>{const ang=i*2*Math.PI/Math.max(n,1)-Math.PI/2,rad=n>1?9:0;p.cx=bx+rad*Math.cos(ang);p.cy=by+rad*Math.sin(ang)})});

  const hit=b=>b.x1<P.l||b.x2>W-4||b.y1<2||b.y2>H-P.b||placed.some(o=>b.x1<o.x2&&b.x2>o.x1&&b.y1<o.y2&&b.y2>o.y1);

  const sel=(id,v)=>`<select id="${id}" aria-label="${id==="posX"?"Across":"Up"}">${M.map((m,i)=>`<option value="${i}" ${i===v?"selected":""}>${m}</option>`).join("")}</select>`;
  return `<h2>Positioning map</h2><p class="lede">Each dot is a company placed by two moat scores. Top right is hardest to copy on both. Crowded dots show their name when you hover; click any dot for its card.</p>
  <div class="toolbar">Across: ${sel("posX",posX)} Up: ${sel("posY",posY)}</div>
  <div class="scroll posw"><svg viewBox="0 0 ${W} ${H}" class="pos" role="img" aria-label="Positioning map, ${M[posX]} across and ${M[posY]} up"><rect x="${sx(5)}" y="${P.t}" width="${sx(10)-sx(5)}" height="${sy(5)-P.t}" class="q"/>${grid}<text x="${(W+P.l)/2}" y="${H-12}" text-anchor="middle" class="ax">${M[posX]} →</text><text x="16" y="${(H-P.b)/2}" text-anchor="middle" class="ax" transform="rotate(-90 16 ${(H-P.b)/2})">${M[posY]} →</text>${dots}</svg></div>`;

function parseQ(q){const phrases=[],exc=[],toks=[];q=String(q).replace(/(-?)"([^"]+)"/g,(m,neg,p)=>{(neg?exc:phrases).push(fold(p).trim());return " "});

function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;const p=[];for(let j=0;j<=b.length;j++)p[j]=j;for(let i=1;i<=a.length;i++){let prev=p[0];p[0]=i;let mn=p[0];for(let j=1;j<=b.length;j++){const tmp=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp;if(p[j]<mn)mn=p[j]}if(mn>max)return max+1}return p[b.length]}
function matchEntry(e,P,fuzzy){

  let score=0;
  for(const w of P.toks){let best=9;const re=new RegExp("(^|[^a-z0-9])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
    if(re.test(ti))best=0;else if(ti.includes(w))best=1;else if(re.test(wh))best=2;else if(tx.some(t=>re.test(t)))best=2.5;else if(tx.some(t=>t.includes(w)))best=3;else if(wh.includes(w))best=3.5;
    else if(fuzzy&&w.length>=4){const max=w.length>=8?2:1;const words=e._ws||(e._ws=[...new Set((ti+" "+tx.join(" ")).split(/[^a-z0-9]+/).filter(x=>x.length>=3))]);if(words.some(x=>lev(w,x,max)<=max))best=4}
    if(best===9)return null;score+=best}

function searchAll(q){q=q.trim();if(q.length<2)return {list:[],counts:{},fuzzy:false,toks:[]};
  const P=parseQ(q);if(!P.toks.length&&!P.phrases.length)return {list:[],counts:{},fuzzy:false,toks:[]};
  const idx=buildIndex();
  const run=fz=>{const r=[];idx.forEach(e=>{const s=matchEntry(e,P,fz);if(s!==null)r.push({e,s})});return r};
  let res=run(false),fuzzy=false;if(!res.length){res=run(true);fuzzy=res.length>0}
  res.sort((a,b)=>a.s-b.s);
  const counts={all:res.length};res.forEach(r=>{counts[r.e.g]=(counts[r.e.g]||0)+1});
  return {list:res,counts,fuzzy,toks:P.toks.concat(P.phrases)}}

  if(id==="up-media"){e.target.value="";try{syncRows();const durl=await shrinkImage(f);draft.media.push({type:"screenshot",title:f.name.replace(/\.[^.]+$/,""),url:"",dataUrl:durl});redrawRows("media")}catch(err){g("upMsg").textContent="Could not read that image."}}
});
document.addEventListener("submit",e=>{if(e.target.id!=="pf")return;e.preventDefault();const err=readAndSave();if(err){g("ferr").textContent=err;return}closeModal();toast("Saved")});
$("#addBtn").addEventListener("click",()=>{const v=route();if(v==="notes")return openNote();v==="landscape"?openTool():v==="analysis"?(curA()?openSection(null):openAnalysis()):openPlayer()});
$("#q").addEventListener("input",()=>{sidx=0;drawSearch()});
$("#q").addEventListener("focus",()=>drawSearch());
$("#q").addEventListener("keydown",e=>{const box=$("#sdrop");if(e.key==="ArrowDown"){e.preventDefault();sidx=Math.min(sidx+1,sres.length-1);drawSearch();const on=box.querySelector(".on");if(on)on.scrollIntoView({block:"nearest"})}else if(e.key==="ArrowUp"){e.preventDefault();sidx=Math.max(sidx-1,0);drawSearch();const on=box.querySelector(".on");if(on)on.scrollIntoView({block:"nearest"})}else if(e.key==="Enter"){e.preventDefault();goResult(sres[sidx])}else if(e.key==="Escape"){box.hidden=true;$("#q").blur()}});
document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");if(((e.key==="k"||e.key==="K")&&(e.metaKey||e.ctrlKey))||(e.key==="/"&&!typing)){e.preventDefault();$("#q").focus();$("#q").select()}});
new MutationObserver(()=>{document.querySelectorAll("[data-fb]").forEach(el=>{el.removeAttribute("data-fb");el.addEventListener("error",()=>el.remove(),{once:true});if(el.tagName==="IMG"&&el.complete&&!el.naturalWidth&&el.src)el.remove()})}).observe(document.body,{childList:true,subtree:true});
addEventListener("hashchange",()=>{openCell=null;render();scrollTo({top:0})});
async function addShots(did,files){const d=S.demos.find(x=>x.id===did);if(!d)return;files=files.filter(f=>/^image\//.test(f.type));if(!files.length){toast("Only images can be added here");return}
  toast("Adding "+files.length+" screenshot"+(files.length>1?"s":"")+"…");d.media=d.media||[];
  for(const f of files){try{const durl=await shrinkImage(f);d.media.push({type:"screenshot",title:(f.name||"Screenshot").replace(/\.[^.]+$/,"").replace(/^image$/,"Screenshot"),url:"",dataUrl:durl,addedAt:new Date().toISOString().slice(0,10)})}catch(e){}}
  logChange(d.player+": "+files.length+" screenshot"+(files.length>1?"s":"")+" added");persist();toast("Added. Publish to share them.")}
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("[data-dropd]");if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-dropd]");if(z)z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-dropd]");if(!z)return;e.preventDefault();z.classList.remove("over");addShots(z.dataset.dropd,[...e.dataTransfer.files])});
let pasteTarget=null;document.addEventListener("focusin",e=>{const z=e.target.closest&&e.target.closest("[data-dropd]");pasteTarget=z?z.dataset.dropd:(e.target.closest&&e.target.closest("#modalRoot")?null:pasteTarget)});
document.addEventListener("pointerdown",e=>{const z=e.target.closest&&e.target.closest("[data-dropd]");if(z)pasteTarget=z.dataset.dropd});
document.addEventListener("paste",e=>{if(!route()==="analysis"||$("#modalRoot").innerHTML||!pasteTarget)return;const files=[...(e.clipboardData||{}).files||[]].filter(f=>/^image\//.test(f.type));if(files.length){e.preventDefault();addShots(pasteTarget,files)}});
let viewer=null;
function openViewer(did,i){viewer={did,i};drawViewer()}
function viewerList(){const d=S.demos.find(x=>x.id===viewer.did);return d?(d.media||[]).map((m,i)=>({m,i})).filter(x=>isShot(x.m)):[]}
function drawViewer(){const L=viewerList(),k=L.findIndex(x=>x.i===viewer.i);if(k<0){closeViewer();return}const m=L[k].m,src=m.dataUrl||safeUrl(m.url);
  let el=document.getElementById("viewerRoot");if(!el){el=document.createElement("div");el.id="viewerRoot";document.body.appendChild(el)}
  el.innerHTML=`<div class="viewer" role="dialog" aria-modal="true" aria-label="Screenshot"><div class="vbar"><span>${esc(m.title||"Screenshot")} · ${k+1} of ${L.length}</span><span class="acts">${L.length>1?`<button class="btn sm" type="button" data-vnav="-1">← Prev</button><button class="btn sm" type="button" data-vnav="1">Next →</button>`:""}<button class="btn sm" type="button" data-vclose>Close</button></span></div><img src="${esc(src)}" alt="${esc(m.title||"")}"></div>`}
function viewerStep(n){const L=viewerList(),k=L.findIndex(x=>x.i===viewer.i);viewer.i=L[(k+n+L.length)%L.length].i;drawViewer()}
function closeViewer(){viewer=null;const el=document.getElementById("viewerRoot");if(el)el.innerHTML=""}
document.addEventListener("keydown",e=>{if(!viewer)return;if(e.key==="Escape"){e.stopImmediatePropagation();closeViewer()}else if(e.key==="ArrowRight")viewerStep(1);else if(e.key==="ArrowLeft")viewerStep(-1)},true);
boot();
</script>
